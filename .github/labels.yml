# Labels for auto-labeling PRs
# Create these labels in GitHub Settings > Labels

- name: "app:web"
  color: "0366d6"
  description: "Changes to web app"

- name: "app:widget"
  color: "5319e7"
  description: "Changes to widget app"

- name: "pkg:ui"
  color: "fbca04"
  description: "Changes to UI package"

- name: "pkg:backend"
  color: "d93f0b"
  description: "Changes to backend package"

- name: "tooling"
  color: "c5def5"
  description: "Build, lint, or config changes"

- name: "ci/cd"
  color: "bfd4f2"
  description: "CI/CD workflow changes"

- name: "documentation"
  color: "0075ca"
  description: "Documentation updates"

- name: "size/small"
  color: "009900"
  description: "Small PR (< 200 lines)"

- name: "size/medium"
  color: "ffcc00"
  description: "Medium PR (200-500 lines)"

- name: "size/large"
  color: "ff9900"
  description: "Large PR (500-1000 lines)"

- name: "size/extra-large"
  color: "ff0000"
  description: "Extra large PR (> 1000 lines)"
