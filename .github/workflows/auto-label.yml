name: Auto Label

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR based on paths
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const labels = new Set();
            
            const pathToLabel = {
              'apps/web/': 'app:web',
              'apps/widget/': 'app:widget',
              'packages/ui/': 'pkg:ui',
              'packages/backend/': 'pkg:backend',
              'packages/eslint-config/': 'tooling',
              'packages/typescript-config/': 'tooling',
              '.github/': 'ci/cd',
              'docs/': 'documentation',
            };
            
            for (const file of files) {
              for (const [path, label] of Object.entries(pathToLabel)) {
                if (file.filename.startsWith(path)) {
                  labels.add(label);
                }
              }
              
              // File type labels
              if (file.filename.endsWith('.md')) labels.add('documentation');
              if (file.filename.endsWith('.yml') || file.filename.endsWith('.yaml')) labels.add('ci/cd');
            }
            
            if (labels.size > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [...labels]
                });
                console.log(`Added labels: ${[...labels].join(', ')}`);
              } catch (e) {
                core.info(`Could not add labels: ${e.message}`);
              }
            }
