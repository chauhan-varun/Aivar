# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  # Enable automatic reviews on PRs
  auto_review:
    enabled: true
    # Ignore minor changes like formatting
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "draft"
    drafts: false
    base_branches:
      - main
      - develop

  # Review profile - assertive gives more detailed feedback
  profile: assertive

  # Request changes for critical issues
  request_changes_workflow: true

  # High-level summary at the top of review
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"

  # Poem at the end of review (fun feature)
  poem: false

  # Review effort - 1-5 scale
  review_effort: 3

  # Collapse walkthrough section for cleaner PRs
  collapse_walkthrough: true

  # Path-specific review instructions
  path_instructions:
    - path: "apps/web/**"
      instructions: |
        This is the main Next.js web application.
        - Check for proper use of 'use client' and 'use server' directives
        - Ensure proper error handling with Clerk auth
        - Verify Convex queries/mutations are used correctly
        - Check for accessibility best practices

    - path: "apps/widget/**"
      instructions: |
        This is an embeddable widget application with Vapi voice AI.
        - Ensure Vapi integration follows best practices
        - Check for proper state management
        - Widget must be lightweight and performant

    - path: "packages/ui/**"
      instructions: |
        This is the shared UI component library using shadcn/ui.
        - Components should be reusable and well-typed
        - Check for accessibility (ARIA attributes, keyboard navigation)
        - Ensure consistent styling with design tokens
        - Avoid breaking changes to component APIs

    - path: "packages/backend/**"
      instructions: |
        This is the Convex backend.
        - Verify schema changes are backward compatible
        - Check for proper input validation
        - Ensure queries/mutations have appropriate access controls

    - path: ".github/**"
      instructions: |
        CI/CD configuration files.
        - Ensure workflows are efficient and don't waste resources
        - Check for security best practices
        - Validate that secrets are properly referenced

  # Tools that CodeRabbit should use
  tools:
    # Static analysis
    eslint:
      enabled: true
    biome:
      enabled: false

    # Security
    gitleaks:
      enabled: true

    # Language servers
    languagetool:
      enabled: true
      enabled_only: false
      level: picky

chat:
  # Allow inline comments for discussions
  auto_reply: true

# Files and patterns to ignore
path_filters:
  # Ignore generated files
  - "!**/node_modules/**"
  - "!**/.next/**"
  - "!**/dist/**"
  - "!**/build/**"
  - "!**/_generated/**"
  - "!**/docs/**"
  - "!**/pnpm-lock.yaml"
  - "!**/*.min.js"
  - "!**/*.min.css"

# Knowledge base for context
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
